services:
  # Servicio 1: El motor de PHP (Sin servidor web)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: disruptive-wealth-php-fpm
    restart: always
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: production

  # Servicio 2: El servidor Web (Nginx ligero)
  web:
    image: nginx:alpine
    restart: always
    ports:
      - "8006:80"
    volumes:
      - ./:/var/www/html  # Necesita ver los archivos para servir estáticos
      - ./nginx-conf:/etc/nginx/conf.d # Configuración personalizada
    depends_on:
      - app